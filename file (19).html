<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiederholung – Mykorrhiza: Pilz und Baum</title>
<style>
  :root{--wa-dunkel:#075E54;--wa-gruen:#128C7E;--blase-user:#DCF8C6;--bg:#ECE5DD;--text:#303030}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Calibri,Arial,sans-serif;background:#cfd8cc;display:flex;justify-content:center;min-height:100vh}
  .app{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 20px rgba(0,0,0,.25);position:relative;overflow:hidden}
  header{background:var(--wa-dunkel);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
  .back{font-size:20px}
  .avatar{width:40px;height:40px;border-radius:50%;background:#dcf8c6;display:flex;align-items:center;justify-content:center;font-size:22px}
  header h1{font-size:16.5px;font-weight:600;line-height:1.15}
  header small{font-size:12px;opacity:.85}
  #progress{height:4px;background:#b7d8c9}
  #bar{height:100%;width:0;background:#25D366;transition:width .5s}
  #chat{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;
    background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
  .tagchip{align-self:center;background:#e1f2fb;color:#54656f;font-size:12px;padding:4px 10px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
  .msg{max-width:86%;padding:7px 10px 6px;border-radius:9px;font-size:15px;line-height:1.38;color:var(--text);
    box-shadow:0 1px 1px rgba(0,0,0,.13);animation:pop .22s ease;position:relative}
  .bot{background:#fff;align-self:flex-start;border-top-left-radius:0}
  .user{background:var(--blase-user);align-self:flex-end;border-top-right-radius:0}
  .name{display:block;color:var(--wa-gruen);font-size:12.5px;font-weight:600;margin-bottom:2px}
  .zeit{display:block;text-align:right;font-size:10.5px;color:#8a8a8a;margin-top:2px}
  .user .zeit b{color:#34B7F1;font-weight:700;margin-left:2px}
  .ok{border-left:5px solid #25D366}
  .nok{border-left:5px solid #e57373}
  .info{border-left:5px solid #ffb300;background:#fffbe6}
  .finale{border-left:5px solid #25D366;background:#f1fff0;font-size:16px;text-align:center}
  .finale .emojis{font-size:26px;line-height:1.5;display:block}
  .finale .gross{display:block;font-weight:800;font-size:18px;color:var(--wa-dunkel);margin:6px 0}
  .codebox{margin:10px 0 6px;padding:12px 10px;border:3px dashed var(--wa-dunkel);border-radius:12px;background:#fff;animation:glow 1.6s infinite}
  .codebox .label{display:block;font-size:13px;font-weight:700;color:var(--wa-gruen);letter-spacing:1px;text-transform:uppercase}
  .codebox .zahl{display:block;font-size:44px;font-weight:900;letter-spacing:10px;color:var(--wa-dunkel);font-family:"Courier New",monospace;margin:4px 0 2px;padding-left:10px}
  @keyframes glow{50%{box-shadow:0 0 14px 3px rgba(37,211,102,.55)}}
  .stempel{align-self:center;border:3px solid var(--wa-dunkel);color:var(--wa-dunkel);font-weight:800;letter-spacing:2px;
    padding:8px 16px;border-radius:8px;transform:rotate(-4deg);background:#fff;text-align:center;animation:pop .4s ease}
  .typing{display:flex;gap:4px;padding:12px 14px}
  .typing span{width:8px;height:8px;border-radius:50%;background:#9aa7a1;animation:bl 1s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  /* Austausch-Bild Baum <-> Pilz */
  .tausch{margin:6px 0 2px;border-radius:10px;overflow:hidden;border:2px solid #25D366;font-size:14px;text-align:center}
  .tausch .t{padding:8px;font-weight:700;background:#f1fff0;color:var(--wa-dunkel)}
  .tausch .t.boden{background:#ece0d1;color:#5b3a1e}
  .tausch .pfeil{padding:6px 8px;background:#fffbe6;font-weight:700}
  .tausch .pfeil span{display:inline-block;background:#ffeb3b;border-radius:6px;padding:1px 8px;font-weight:800;animation:puls 1.2s infinite}
  @keyframes puls{50%{filter:brightness(1.2)}}
  #answers{background:#f0f0f0;padding:8px;display:flex;flex-direction:column;gap:6px;border-top:1px solid #ddd;max-height:46vh;overflow-y:auto}
  #answers:empty{display:none}
  .opt{background:#fff;border:1.5px solid var(--wa-gruen);color:var(--wa-dunkel);border-radius:18px;padding:9px 14px;font-size:14.5px;
    text-align:left;cursor:pointer;font-family:inherit;line-height:1.3;transition:.15s}
  .opt:hover,.opt:active{background:var(--wa-gruen);color:#fff}
  .regen{position:absolute;top:-40px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:10}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <span class="back">←</span>
    <div class="avatar">🍄</div>
    <div><h1>Mykorrhiza-Expertin</h1><small id="status">online</small></div>
  </header>
  <div id="progress"><div id="bar"></div></div>
  <div id="chat"></div>
  <div id="answers"></div>
</div>

<script>
/* ================= EINSTELLUNGEN ================= */
const CODE = "2973";                    // Code, der am Ende angezeigt wird
const NAME = "Mykorrhiza-Expertin";     // Name der Chat-Partnerin

const LOB = ["Super gemacht! 👏","Volltreffer! 🎯","Genau so! 🍄","Bravo, richtig gedacht! 🌳","Stark! 💪",
  "Top, Profi! ⭐","Richtig kombiniert! 🧠","Messerscharf! 🔎","Glänzend! ✨","Das sitzt! 🙌","Spitze! 🌟","Ein echtes Naturtalent! 🏅"];
const LOB2 = ["Diesmal sitzt es! 💪","Zweiter Versuch, voller Erfolg! 🎉","Gut nachgedacht, jetzt stimmt es! 👏","Dranbleiben hat sich gelohnt! 🌟"];
let letztesLob = -1;
function lob(zweite){
  const liste = zweite ? LOB2 : LOB; let i;
  do { i = Math.floor(Math.random()*liste.length); } while(i===letztesLob && liste.length>1);
  letztesLob = i; return liste[i];
}

/* ================= FRAGEN (Mykorrhiza) ================= */
function tausch(modus){
  // modus 1: Baum -> Pilz fraglich, modus 2: Pilz -> Baum fraglich
  const a = modus===1 ? '⬇️ <span>❓</span> ⬇️' : '⬇️ ? ⬇️';
  const b = modus===2 ? '⬆️ <span>❓</span> ⬆️' : '⬆️ ? ⬆️';
  return '<div class="tausch">'+
    '<div class="t">🌳 Baum (Wurzeln)</div>'+
    '<div class="pfeil">'+(modus===1 ? a : '⬇️ ⬇️')+'</div>'+
    '<div class="pfeil">'+(modus===2 ? b : '⬆️ ⬆️')+'</div>'+
    '<div class="t boden">🍄 Pilzgeflecht im Boden</div></div>';
}

const FRAGEN = [
 { q:"Willkommen zur Wiederholung! 🌳🍄 Viele Bäume leben mit Pilzen zusammen, die ihre Wurzeln umgeben oder in sie eindringen. Wie heißt diese enge Lebensgemeinschaft?",
   o:[{t:"Mykorrhiza",ok:true},{t:"Mineralisierung"},{t:"Fotosynthese"},{t:"Stoffkreislauf"}],
   tipp:"Das Wort setzt sich aus „Pilz“ und „Wurzel“ zusammen (griechisch: mykes = Pilz, rhiza = Wurzel).",
   e:"Die Lebensgemeinschaft von Pilz und Baumwurzel heißt <b>Mykorrhiza</b> („Pilzwurzel“)." },
 { q:"Spur 2: Die Mykorrhiza ist eine <b>Symbiose</b>. Was bedeutet das? 🤝",
   o:[{t:"Zwei Arten leben eng zusammen und beide haben einen Nutzen davon.",ok:true},
      {t:"Eine Art lebt auf Kosten einer anderen und schädigt sie."},
      {t:"Zwei Arten leben nebeneinander und haben nichts miteinander zu tun."},
      {t:"Eine Art frisst die andere Art vollständig auf."}],
   tipp:"Überlege: Was bekommt der Pilz, was bekommt der Baum? Hat nur einer etwas davon?",
   e:"Bei einer <b>Symbiose</b> leben zwei Arten zusammen und <b>beide profitieren</b>. Wenn nur einer profitiert und der andere geschädigt wird, wäre es Parasitismus." },
 { q:"Spur 3: Was liefert der <b>Baum</b> an den Pilz? 🌳⬇️🍄",
   vis: tausch(1),
   o:[{t:"Zucker (Produkte der Fotosynthese)",ok:true},
      {t:"Mineralsalze aus dem Boden"},
      {t:"Sauerstoff zum Wachsen im Boden"},
      {t:"Totes Holz zum Zersetzen"}],
   tipp:"Der Baum betreibt Fotosynthese. Was stellt er dabei in seinen Blättern her?",
   e:"Der Baum gibt einen Teil der in den Blättern durch Fotosynthese gebildeten <b>Zuckerstoffe</b> über die Wurzeln an den Pilz ab." },
 { q:"Spur 4: Warum ist der Pilz auf den Zucker vom Baum angewiesen? 🍄",
   o:[{t:"Er hat kein Chlorophyll und kann deshalb selbst keine Fotosynthese betreiben.",ok:true},
      {t:"Er hat zu viel Chlorophyll und muss es loswerden."},
      {t:"Er kann nur Zucker aufnehmen, weil er keine Zellen besitzt."},
      {t:"Er betreibt Fotosynthese, aber nur nachts."}],
   tipp:"Pilze sind keine Pflanzen. Womit betreiben Pflanzen Fotosynthese, und was fehlt dem Pilz?",
   e:"Pilze haben <b>kein Chlorophyll</b> und können keine Fotosynthese betreiben. Sie müssen sich ihre energiereichen Stoffe von anderen Lebewesen holen, hier vom Baum." },
 { q:"Spur 5: Und was liefert der <b>Pilz</b> an den Baum? 🍄⬆️🌳",
   vis: tausch(2),
   o:[{t:"Wasser und Mineralsalze (zum Beispiel Stickstoff- und Phosphorverbindungen)",ok:true},
      {t:"Zucker aus der Fotosynthese"},
      {t:"Licht für die Blätter"},
      {t:"Kohlenstoffdioxid für die Fotosynthese"}],
   tipp:"Was holen Wurzeln normalerweise aus dem Boden? Der Pilz hilft dabei.",
   e:"Der Pilz nimmt <b>Wasser und Mineralsalze</b> aus dem Boden auf und gibt sie an den Baum weiter." },
 { q:"Spur 6: Warum kann der Pilz so viel Wasser und so viele Mineralsalze aufnehmen? 🔬",
   o:[{t:"Sein Geflecht aus feinen Fäden (Hyphen) reicht bis in kleinste Bodenporen und hat eine riesige Oberfläche.",ok:true},
      {t:"Sein Pilzhut ist sehr groß und saugt alles über dem Boden auf."},
      {t:"Er hat dicke, kräftige Wurzeln, die tief in den Fels dringen."},
      {t:"Er hat nur eine sehr kleine Oberfläche, deshalb spart er Wasser."}],
   tipp:"Denke an Station 2: Was passiert mit der Oberfläche, wenn etwas aus unzähligen feinen Fäden besteht?",
   e:"Das Pilzgeflecht (Mycel) besteht aus unzähligen <b>feinen Fäden (Hyphen)</b>. Sie sind viel dünner als Wurzelhaare und haben eine <b>riesige Oberfläche</b>. So erschließen sie Wasser und Nährstoffe, an die der Baum allein nicht herankäme." },
 { q:"Spur 7: Im Wald siehst du manchmal Pilze mit Hut und Stiel. Wie verhält sich das zum ganzen Pilz? 👀",
   o:[{t:"Hut und Stiel sind nur der Fruchtkörper. Der größte Teil des Pilzes ist das Geflecht im Boden.",ok:true},
      {t:"Hut und Stiel sind der ganze Pilz, im Boden ist nichts."},
      {t:"Hut und Stiel sind die Wurzeln des Baumes."},
      {t:"Das Geflecht im Boden ist nur ein kleiner Teil, der Hauptteil ist der Hut."}],
   tipp:"Vergleiche mit einem Apfelbaum: Der Apfel ist nur die Frucht, nicht der ganze Baum.",
   e:"Der sichtbare <b>Fruchtkörper</b> ist nur ein kleiner Teil des Pilzes. Der Hauptteil ist das <b>Pilzgeflecht (Mycel) im Boden</b>, das mit den Baumwurzeln verbunden ist." },
 { q:"Letzte Spur: Stell dir vor, die Mykorrhiza wird zerstört (zum Beispiel durch starke Bodenverdichtung). Was passiert? 🌳💔🍄",
   o:[{t:"Der Baum bekommt weniger Wasser und Mineralsalze, der Pilz bekommt keinen Zucker mehr. Beiden geht es schlechter.",ok:true},
      {t:"Dem Baum geht es besser, weil er den Zucker für sich behält. Dem Pilz geht es unverändert."},
      {t:"Nur dem Baum geht es schlechter, der Pilz profitiert davon."},
      {t:"Nichts, denn beide leben völlig unabhängig voneinander."}],
   tipp:"Überlege, was jeder der beiden Partner nur durch den anderen bekommt.",
   e:"Beide Partner sind aufeinander angewiesen: Der Baum verliert <b>Wasser und Mineralsalze</b>, der Pilz verliert seinen <b>Zucker</b>. Genau das macht die Symbiose aus: <b>gegenseitiger Nutzen</b>." }
];

/* ================= ABLAUF ================= */
const chat=document.getElementById("chat"), answers=document.getElementById("answers"),
      bar=document.getElementById("bar"), statusEl=document.getElementById("status"),
      app=document.getElementById("app");

let runde=FRAGEN.map((_,i)=>i), pos=0, falsch=[], geloest=0, rundenNr=1;

function zeit(){const d=new Date();return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")}
function nachUnten(){chat.scrollTop=chat.scrollHeight}
function msg(html,cls,user){
  const d=document.createElement("div");d.className="msg "+cls;
  d.innerHTML=html+'<span class="zeit">'+zeit()+(user?' <b>✓✓</b>':'')+'</span>';
  chat.appendChild(d);nachUnten();return d;
}
function bot(html,extra=""){return msg('<span class="name">'+NAME+'</span>'+html,"bot "+extra)}
function typing(cb,ms=900){
  statusEl.textContent="schreibt …";
  const t=document.createElement("div");t.className="msg bot typing";t.innerHTML="<span></span><span></span><span></span>";
  chat.appendChild(t);nachUnten();
  setTimeout(()=>{t.remove();statusEl.textContent="online";cb()},ms);
}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])}

function frage(){
  const nr=runde[pos], f=FRAGEN[nr];
  typing(()=>{
    let html=f.q;
    if(rundenNr>1) html='<i>🔁 Wiederholung:</i> '+html+'<br><br>💡 <b>Tipp:</b> '+f.tipp;
    if(f.vis) html+=f.vis;
    bot(html);
    answers.innerHTML="";
    shuffle(f.o).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o.t;
      b.onclick=()=>pruefe(o,nr,f);answers.appendChild(b);
    });
  });
}

function pruefe(o,nr,f){
  answers.innerHTML="";
  msg(o.t,"user",true);
  if(o.ok){
    geloest++;bar.style.width=(geloest/FRAGEN.length*100)+"%";
    typing(()=>{
      bot("✅ <b>"+lob(rundenNr>1)+"</b><br>"+f.e,"ok");
      weiter();
    },750);
  }else{
    falsch.push(nr);
    typing(()=>{
      bot("🤔 Das passt noch nicht. "+f.tipp+"<br>Kein Problem: Ich frage dich diese Frage am Ende noch einmal.","nok");
      weiter();
    },750);
  }
}

function weiter(){
  pos++;
  if(pos<runde.length){frage();return}
  if(falsch.length===0){ende();return}
  rundenNr++;
  runde=falsch.slice();falsch=[];pos=0;
  typing(()=>{
    bot("📋 Ein paar Fragen sind noch offen. Ich frage <b>"+runde.length+(runde.length===1?" Frage":" Fragen")+"</b> noch einmal ab. Erst wenn <b>alle</b> Fragen richtig beantwortet sind, bekommst du den Code. 🔐💪","info");
    frage();
  },900);
}

/* ================= ABSCHLUSS ================= */
function emojiRegen(){
  const liste=["🎉","🎊","🌟","⭐","🍄","🌳","🍂","🍃","🌲","🏆","👏","✨","🥳","🤝","🐛","🔐"];
  for(let i=0;i<40;i++){
    setTimeout(()=>{
      const e=document.createElement("span");
      e.className="regen";
      e.textContent=liste[Math.floor(Math.random()*liste.length)];
      e.style.left=Math.random()*95+"%";
      e.style.animationDuration=(2.5+Math.random()*2.5)+"s";
      app.appendChild(e);
      setTimeout(()=>e.remove(),5500);
    },i*90);
  }
}

function ende(){
  typing(()=>{
    const s=document.createElement("div");s.className="stempel";s.innerHTML="🍄🌳 WIEDERHOLUNG<br>ABGESCHLOSSEN ✅";
    chat.appendChild(s);
    bot('<span class="emojis">🎉🥳🎊🏆🎉</span>'+
        '<span class="gross">Super gemacht! 👏🌟</span>'+
        'Du kennst dich mit der Mykorrhiza bestens aus! 🍄🤝🌳 Hier ist dein geheimer Code:'+
        '<div class="codebox"><span class="label">🔐 Dein Code 🔐</span>'+
        '<span class="zahl">'+CODE+'</span></div>'+
        'Merke dir diese Zahl oder schreibe sie auf! ✍️📝'+
        '<span class="emojis">🌲🍂🍄🌳🍃🔎✨💚🔓</span>',"finale");
    emojiRegen();
    nachUnten();
  },900);
}

/* ================= START ================= */
chat.insertAdjacentHTML("beforeend",'<div class="tagchip">Heute</div>');
typing(()=>{
  bot("Hallo, Wald-Profi! 🍄🌳 Heute wiederholen wir die <b>Mykorrhiza: die Symbiose von Pilz und Baum</b>. 🤝 Falls eine Antwort nicht stimmt, frage ich am Ende noch einmal nach. Wenn du alles richtig hast, bekommst du einen <b>geheimen Code</b>. 🔐 Bereit? 🌲");
  const b=document.createElement("button");b.className="opt";b.textContent="🍄 Wiederholung starten";
  b.onclick=()=>{answers.innerHTML="";msg("Wiederholung starten","user",true);frage()};
  answers.appendChild(b);
},600);
</script>
</body>
</html>
