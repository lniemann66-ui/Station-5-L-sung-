<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spurensicherung Station 5 – Fallabschluss: Ermittlungsbericht</title>
<style>
  :root{--wa-dunkel:#075E54;--wa-gruen:#128C7E;--blase-user:#DCF8C6;--bg:#ECE5DD;--text:#303030}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Calibri,Arial,sans-serif;background:#cfd8cc;display:flex;justify-content:center;min-height:100vh}
  .app{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 20px rgba(0,0,0,.25);position:relative;overflow:hidden}
  header{background:var(--wa-dunkel);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
  .back{font-size:20px}
  .avatar{width:40px;height:40px;border-radius:50%;background:#dcf8c6;display:flex;align-items:center;justify-content:center;font-size:22px}
  header h1{font-size:16.5px;font-weight:600;line-height:1.15}
  header small{font-size:12px;opacity:.85}
  #progress{height:4px;background:#b7d8c9}
  #bar{height:100%;width:0;background:#25D366;transition:width .5s}
  #chat{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;
    background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
  .tagchip{align-self:center;background:#e1f2fb;color:#54656f;font-size:12px;padding:4px 10px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
  .msg{max-width:86%;padding:7px 10px 6px;border-radius:9px;font-size:15px;line-height:1.38;color:var(--text);
    box-shadow:0 1px 1px rgba(0,0,0,.13);animation:pop .22s ease;position:relative}
  .bot{background:#fff;align-self:flex-start;border-top-left-radius:0}
  .user{background:var(--blase-user);align-self:flex-end;border-top-right-radius:0}
  .name{display:block;color:var(--wa-gruen);font-size:12.5px;font-weight:600;margin-bottom:2px}
  .zeit{display:block;text-align:right;font-size:10.5px;color:#8a8a8a;margin-top:2px}
  .user .zeit b{color:#34B7F1;font-weight:700;margin-left:2px}
  .ok{border-left:5px solid #25D366}
  .nok{border-left:5px solid #e57373}
  .info{border-left:5px solid #ffb300;background:#fffbe6}
  .finale{border-left:5px solid #25D366;background:#f1fff0;font-size:16px;text-align:center}
  .finale .emojis{font-size:26px;line-height:1.5;display:block}
  .finale .gross{display:block;font-weight:800;font-size:18px;color:var(--wa-dunkel);margin:6px 0}
  .codebox{margin:10px 0 6px;padding:12px 10px;border:3px dashed var(--wa-dunkel);border-radius:12px;background:#fff;animation:glow 1.6s infinite}
  .codebox .label{display:block;font-size:13px;font-weight:700;color:var(--wa-gruen);letter-spacing:1px;text-transform:uppercase}
  .codebox .zahl{display:block;font-size:44px;font-weight:900;letter-spacing:10px;color:var(--wa-dunkel);font-family:"Courier New",monospace;margin:4px 0 2px;padding-left:10px}
  @keyframes glow{50%{box-shadow:0 0 14px 3px rgba(37,211,102,.55)}}
  .stempel{align-self:center;border:3px solid var(--wa-dunkel);color:var(--wa-dunkel);font-weight:800;letter-spacing:2px;
    padding:8px 16px;border-radius:8px;transform:rotate(-4deg);background:#fff;text-align:center;animation:pop .4s ease}
  .typing{display:flex;gap:4px;padding:12px 14px}
  .typing span{width:8px;height:8px;border-radius:50%;background:#9aa7a1;animation:bl 1s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  #answers{background:#f0f0f0;padding:8px;display:flex;flex-direction:column;gap:6px;border-top:1px solid #ddd;max-height:46vh;overflow-y:auto}
  #answers:empty{display:none}
  .opt{background:#fff;border:1.5px solid var(--wa-gruen);color:var(--wa-dunkel);border-radius:18px;padding:9px 14px;font-size:14.5px;
    text-align:left;cursor:pointer;font-family:inherit;line-height:1.3;transition:.15s}
  .opt:hover,.opt:active{background:var(--wa-gruen);color:#fff}
  .regen{position:absolute;top:-40px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:10}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <span class="back">←</span>
    <div class="avatar">🕵️</div>
    <div><h1>Kommissarin Laubach</h1><small id="status">online</small></div>
  </header>
  <div id="progress"><div id="bar"></div></div>
  <div id="chat"></div>
  <div id="answers"></div>
</div>

<script>
/* ================= EINSTELLUNGEN ================= */
const CODE = "7430";

const LOB = ["Super gemacht! 👏","Volltreffer! 🎯","Genau so! 🕵️","Bravo, scharfer Blick! 🔍","Stark ermittelt! 💪",
  "Top, Detektiv*in! ⭐","Richtig kombiniert! 🧠","Messerscharf! 🔎","Glänzend! ✨","Das sitzt! 🙌","Spitze! 🌟","Ein echtes Ermittlungstalent! 🏅"];
const LOB2 = ["Diesmal sitzt es! 💪","Zweiter Versuch, voller Erfolg! 🎉","Gut nachgedacht, jetzt stimmt es! 👏","Dranbleiben hat sich gelohnt! 🌟"];
let letztesLob = -1;
function lob(zweite){
  const liste = zweite ? LOB2 : LOB; let i;
  do { i = Math.floor(Math.random()*liste.length); } while(i===letztesLob && liste.length>1);
  letztesLob = i; return liste[i];
}

/* ================= FRAGEN (Station 5: Ermittlungsbericht) ================= */
const FRAGEN = [
 { q:"Willkommen zum Fallabschluss! 📝 Für deinen Ermittlungsbericht brauchst du zuerst den Tatort. Wo verschwindet das Laub und wie?",
   o:[{t:"Es wird Schicht für Schicht zersetzt, in der Streuschicht und der Vermoderungsschicht des Waldbodens.",ok:true},
      {t:"Es wird vom Wind aus dem Wald getragen."},
      {t:"Es verschwindet über Nacht vollständig in der Gesteinsschicht."},
      {t:"Es wird von lebenden Bäumen wieder angeklebt."}],
   tipp:"Denke an Station 1: Welche Schichten hast du kennengelernt?",
   e:"Das Laub verschwindet nicht einfach. Es wird <b>Schicht für Schicht</b> in der <b>Streuschicht</b> und der <b>Vermoderungsschicht</b> zersetzt." },
 { q:"Spur 2: Der Tathergang! In welcher Reihenfolge arbeiten die Beteiligten? ⏳",
   o:[{t:"Erst Lochfraß (Schnecken, Asseln, Larven), dann Fenster- und Skelettfraß (Springschwänze, Milben), dann Zerkleinerung durch Würmer und Tausendfüßer, am Ende Mineralisierung durch Pilze und Bakterien.",ok:true},
      {t:"Erst Pilze und Bakterien, dann Springschwänze und Milben, dann Würmer, am Ende Schnecken und Asseln."},
      {t:"Erst Würmer und Tausendfüßer, dann Pilze und Bakterien, dann Lochfraß durch Schnecken."},
      {t:"Alle Beteiligten arbeiten gleichzeitig am gleichen Blatt, eine Reihenfolge gibt es nicht."}],
   tipp:"Schau dir noch einmal deine Beweisstücke aus Station 3 an. Was passiert zuerst und was ganz zum Schluss?",
   e:"Der Abbau ist eine <b>Kette mit Arbeitsteilung</b>: Löcher, Fenster und Skelett, Zerkleinerung, Mineralisierung." },
 { q:"Spur 3: Wer sind die eigentlichen <b>Haupttäter</b>? 🍄🦠",
   o:[{t:"Pilze und Bakterien. Diese unsichtbaren Mineralisierer bauen die winzigen Partikel chemisch ab und wandeln sie in Mineralsalze um.",ok:true},
      {t:"Schnecken und Asseln, weil sie als Erste Löcher ins Laub fressen."},
      {t:"Regenwürmer, weil sie die größte Masse haben."},
      {t:"Spinnen, weil sie die anderen Bodentiere jagen."}],
   tipp:"Wer beendet den Zersetzungsprozess ganz am Schluss?",
   e:"Die Haupttäter sind <b>Pilze und Bakterien</b>. Sie sind unsichtbar und wandeln alles in Mineralsalze um." },
 { q:"Spur 4: Das Motiv! 🕵️ Warum zersetzen die Destruenten das Laub überhaupt?",
   o:[{t:"Sie ernähren sich von den energiereichen Stoffen im Laub und gewinnen daraus Energie.",ok:true},
      {t:"Sie wollen den Waldboden sauber halten."},
      {t:"Sie wollen Mineralsalze für die Pflanzen herstellen."},
      {t:"Sie werden von den Bäumen dafür bezahlt."}],
   tipp:"Denke an Station 1: Was steckt in Laub und Totholz?",
   e:"Ihr Motiv ist <b>Nahrung und Energie</b>. Die Mineralsalze sind nur ein „Nebenprodukt“, von dem die Pflanzen profitieren." },
 { q:"Spur 5: Was wird aus dem Laub, wenn es verschwunden ist? 🔄",
   o:[{t:"Es wird zu Mineralsalzen. Die Wurzeln nehmen sie auf und bauen sie in neue Blätter und neues Holz ein. So entsteht ein Stoffkreislauf.",ok:true},
      {t:"Es wird zu Nichts, der Stoff ist für immer verloren."},
      {t:"Es wird zu Energie, die den Wald warm hält."},
      {t:"Es wird zu Stein und bildet den Mineralboden."}],
   tipp:"Der Kreislauf schließt sich bei den Pflanzen.",
   e:"Was oben stirbt, nährt unten den Boden, der wieder neues Leben hervorbringt: ein <b>Stoffkreislauf</b>." },
 { q:"Spur 6: Das Fazit! Wer ist schuld am verschwundenen Laub? ⚖️",
   o:[{t:"Nicht ein einzelner Täter, sondern eine ganze „Verbrecherfamilie“ von Destruenten, die durch Arbeitsteilung und Mineralisierung das Laub in den Waldboden zurückverwandelt.",ok:true},
      {t:"Allein der Regenwurm, weil er am meisten wiegt."},
      {t:"Allein die Schnecke, weil sie als Erste Löcher frisst."},
      {t:"Niemand. Das Laub verschwindet ohne Beteiligte."}],
   tipp:"Du hast viele Verdächtige kennengelernt. Hat einer es allein geschafft?",
   e:"Das verschwundene Laub ist das Opfer einer <b>ganzen Familie von Destruenten</b>, die gezielt zusammenarbeiten und so den Wald ernähren." },
 { q:"Letzte Spur: Du vergleichst mit deiner ersten Vermutung. Was ist dabei besonders überraschend? 🤯",
   o:[{t:"Es braucht eine ganze Kette von Beteiligten. Unsichtbare Mikroorganismen spielen die Hauptrolle, und das Laub ist nicht weg, sondern wird zu Mineralsalzen.",ok:true},
      {t:"Das Laub verschwindet innerhalb weniger Tage vollständig und einfach so."},
      {t:"Nur große, sichtbare Tiere sind am Abbau beteiligt."},
      {t:"Totes Holz ist schon nach wenigen Tagen komplett zersetzt."}],
   tipp:"Denke an die Länge des Prozesses und an die Größe der Haupttäter.",
   e:"Überraschend sind die <b>Kette der Beteiligten</b>, die <b>Hauptrolle der Mikroorganismen</b> und dass das Laub zu <b>Mineralsalzen</b> wird. Der Abbau von totem Holz kann außerdem Jahrzehnte dauern." }
];

/* ================= ABLAUF ================= */
const chat=document.getElementById("chat"), answers=document.getElementById("answers"),
      bar=document.getElementById("bar"), statusEl=document.getElementById("status"),
      app=document.getElementById("app");

let runde=FRAGEN.map((_,i)=>i), pos=0, falsch=[], geloest=0, rundenNr=1;

function zeit(){const d=new Date();return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")}
function nachUnten(){chat.scrollTop=chat.scrollHeight}
function msg(html,cls,user){
  const d=document.createElement("div");d.className="msg "+cls;
  d.innerHTML=html+'<span class="zeit">'+zeit()+(user?' <b>✓✓</b>':'')+'</span>';
  chat.appendChild(d);nachUnten();return d;
}
function bot(html,extra=""){return msg('<span class="name">Kommissarin Laubach</span>'+html,"bot "+extra)}
function typing(cb,ms=900){
  statusEl.textContent="schreibt …";
  const t=document.createElement("div");t.className="msg bot typing";t.innerHTML="<span></span><span></span><span></span>";
  chat.appendChild(t);nachUnten();
  setTimeout(()=>{t.remove();statusEl.textContent="online";cb()},ms);
}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])}

function frage(){
  const nr=runde[pos], f=FRAGEN[nr];
  typing(()=>{
    let html=f.q;
    if(rundenNr>1) html='<i>🔁 Wiederholung:</i> '+html+'<br><br>💡 <b>Tipp:</b> '+f.tipp;
    if(f.vis) html+=f.vis;
    bot(html);
    answers.innerHTML="";
    shuffle(f.o).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o.t;
      b.onclick=()=>pruefe(o,nr,f);answers.appendChild(b);
    });
  });
}

function pruefe(o,nr,f){
  answers.innerHTML="";
  msg(o.t,"user",true);
  if(o.ok){
    geloest++;bar.style.width=(geloest/FRAGEN.length*100)+"%";
    typing(()=>{
      bot("✅ <b>"+lob(rundenNr>1)+"</b><br>"+f.e,"ok");
      weiter();
    },750);
  }else{
    falsch.push(nr);
    typing(()=>{
      bot("🤔 Das passt noch nicht. "+f.tipp+"<br>Kein Problem: Ich frage dich diese Spur am Ende noch einmal.","nok");
      weiter();
    },750);
  }
}

function weiter(){
  pos++;
  if(pos<runde.length){frage();return}
  if(falsch.length===0){ende();return}
  rundenNr++;
  runde=falsch.slice();falsch=[];pos=0;
  typing(()=>{
    bot("📋 Ein paar Spuren sind noch offen. Ich frage <b>"+runde.length+(runde.length===1?" Frage":" Fragen")+"</b> noch einmal ab. Erst wenn <b>alle</b> Spuren richtig gesichert sind, bekommst du den Code. 🔐💪","info");
    frage();
  },900);
}

/* ================= ABSCHLUSS ================= */
function emojiRegen(){
  const liste=["🎉","🎊","🌟","⭐","🕵️","🔍","🍂","🍃","🌲","🏆","👏","✨","🥳","🍄","🐛","🔐","📝"];
  for(let i=0;i<40;i++){
    setTimeout(()=>{
      const e=document.createElement("span");
      e.className="regen";
      e.textContent=liste[Math.floor(Math.random()*liste.length)];
      e.style.left=Math.random()*95+"%";
      e.style.animationDuration=(2.5+Math.random()*2.5)+"s";
      app.appendChild(e);
      setTimeout(()=>e.remove(),5500);
    },i*90);
  }
}

function ende(){
  typing(()=>{
    const s=document.createElement("div");s.className="stempel";s.innerHTML="🏆 FALL GELÖST<br>ERMITTLUNG ABGESCHLOSSEN ✅";
    chat.appendChild(s);
    bot('<span class="emojis">🎉🥳🎊🏆🎉</span>'+ 
        '<span class="gross">Super gemacht! 👏🌟</span>'+ 
        'Der Fall des verschwundenen Laubs ist gelöst! 🕵️‍♀️🔍 Hier ist dein geheimer Code:'+ 
        '<div class="codebox"><span class="label">🔐 Dein Code 🔐</span>'+ 
        '<span class="zahl">'+CODE+'</span></div>'+ 
        'Merke dir diese Zahl oder schreibe sie auf! ✍️📝'+ 
        '<span class="emojis">🌲🍂🍄🐛🍃🔎✨💚🔓</span>',"finale");
    emojiRegen();
    nachUnten();
  },900);
}

/* ================= START ================= */
chat.insertAdjacentHTML("beforeend",'<div class="tagchip">Heute</div>');
typing(()=>{
  bot("Willkommen zum Finale, Boden-Detektiv*in! 🕵️ Heute schließen wir den Fall mit <b>Station 5: Ermittlungsbericht</b> ab. 📝🏆 Falls eine Antwort nicht stimmt, frage ich am Ende noch einmal nach. Wenn du alles richtig hast, bekommst du den <b>letzten geheimen Code</b>. 🔐 Bereit? 🔍");
  const b=document.createElement("button");b.className="opt";b.textContent="🔍 Ermittlung starten";
  b.onclick=()=>{answers.innerHTML="";msg("Ermittlung starten","user",true);frage()};
  answers.appendChild(b);
},600);
</script>
</body>
</html>
