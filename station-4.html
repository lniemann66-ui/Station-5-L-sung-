<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075e54">
<title>Station 4 – Der große Fall: Totholz</title>
<style>
:root{--dark:#075e54;--green:#128c7e;--user:#dcf8c6;--bg:#ece5dd;--text:#303030}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;background:#cfd8cc;color:var(--text);font-family:"Segoe UI",Calibri,Arial,sans-serif}.app{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 20px #0004;overflow:hidden;position:relative}header{background:var(--dark);color:white;padding:10px 12px;display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--user);display:grid;place-items:center;font-size:22px}header h1{font-size:16px;margin:0}header small{font-size:12px;opacity:.85}#progress{height:4px;background:#b7d8c9}#bar{height:100%;width:0;background:#25d366;transition:width .4s}#chat{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(#00000009 1px,transparent 1px);background-size:14px 14px}.date{align-self:center;background:#e1f2fb;color:#54656f;font-size:12px;padding:4px 10px;border-radius:8px}.msg{max-width:88%;padding:8px 10px;border-radius:9px;font-size:15px;line-height:1.4;box-shadow:0 1px 2px #0002;animation:pop .2s}.bot{align-self:flex-start;background:#fff;border-top-left-radius:0}.user{align-self:flex-end;background:var(--user);border-top-right-radius:0}.name{display:block;color:var(--green);font-size:12px;font-weight:700;margin-bottom:3px}.time{display:block;text-align:right;font-size:10px;color:#888;margin-top:3px}.ok{border-left:5px solid #25d366}.wrong{border-left:5px solid #e57373}.info{border-left:5px solid #ffb300;background:#fffbe6}.diagram{margin-top:7px;padding:8px;background:#f1fff0;border:2px solid #25d366;border-radius:10px;text-align:center;font-size:13px;line-height:1.8}.questionmark{background:#ffeb3b;border-radius:5px;padding:1px 6px;font-weight:bold}#answers{max-height:46vh;overflow:auto;padding:8px;background:#f0f0f0;border-top:1px solid #ddd;display:flex;flex-direction:column;gap:6px}#answers:empty{display:none}.opt{padding:10px 13px;border:1.5px solid var(--green);border-radius:18px;background:white;color:var(--dark);font:inherit;font-size:14px;line-height:1.35;text-align:left;cursor:pointer}.opt:hover,.opt:focus{background:var(--green);color:white}.stamp{align-self:center;padding:9px 14px;border:3px solid var(--dark);border-radius:8px;color:var(--dark);background:white;text-align:center;font-weight:800;transform:rotate(-3deg)}.final{border-left:5px solid #25d366;background:#f1fff0;text-align:center;font-size:16px}.final strong{display:block;font-size:18px;color:var(--dark);margin:7px}.code{margin:10px 0;padding:10px;border:3px dashed var(--dark);border-radius:10px;background:white;color:var(--dark);font:bold 40px "Courier New",monospace;letter-spacing:9px}.confetti{position:absolute;top:-35px;font-size:24px;pointer-events:none;animation:fall 4s linear forwards}@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header><div class="avatar">🕵️</div><div><h1>Kommissarin Laubach</h1><small id="status">online</small></div></header>
<div id="progress"><div id="bar"></div></div><main id="chat" aria-live="polite"><div class="date">Station 4 · Totholz</div></main><div id="answers"></div>
</div>
<script>
const CODE="4106";
const questions=[
{q:"Willkommen beim großen Fall! 🪵 Warum sind Zerkleinerer wie Würmer, Asseln, Tausendfüßer und Schnecken die Wegbereiter für Pilze und Bakterien?",opts:["Sie zerbrechen Holz in feine Partikel und vergrößern die Oberfläche. So entstehen Angriffsflächen für Mikroorganismen.","Sie wandeln Holz direkt in Mineralsalze um.","Sie fressen alle Pilze und Bakterien.","Sie machen das Holz härter."],correct:0,hint:"Was passiert mit der Oberfläche, wenn Holz in kleine Teile zerlegt wird?",explain:"Die Zerkleinerer zerlegen das Holz vor und vergrößern die Oberfläche. Dadurch wird es für Mikroorganismen zugänglich."},
{q:"Spur 2: Pilze und Bakterien zerkleinern Holz nicht mechanisch. Wie bauen sie es ab? 🍄",opts:["Sie bilden Enzyme, schließen organische Stoffe chemisch auf und bauen sie zu Mineralsalzen und Kohlenstoffdioxid ab.","Sie zerbeißen die Holzteilchen.","Sie lagern das Holz im Boden ein.","Sie erzeugen mit Licht neue Zuckerstoffe."],correct:0,hint:"Pilze und Bakterien arbeiten nicht mechanisch, sondern chemisch.",explain:"Pilze und Bakterien bilden Enzyme. Sie bauen Holzstoffe bis zu Mineralsalzen und Kohlenstoffdioxid ab."},
{q:"Spur 3: Welcher Vergleich passt am besten zu Pilzen und Bakterien im Wald? ♻️",opts:["Sie sind nicht der Schredder, sondern das Recycling-Zentrum des Waldes.","Sie sind der Schredder, der Holz grob zerkleinert.","Sie transportieren das Holz aus dem Wald.","Sie schützen das Holz vor Zersetzern."],correct:0,hint:"Wer zerkleinert, und wer verwandelt am Ende alles in nutzbare Stoffe?",explain:"Durch Mineralisierung entstehen wieder pflanzenverfügbare Nährstoffe. Pilze und Bakterien sind das Recycling-Zentrum."},
{q:"Spur 4: Was passiert mit den Mineralsalzen im Kreislauf? 💎",diagram:true,opts:["Pflanzenwurzeln nehmen sie auf und bauen sie in neue Blätter, Äste und Holz ein.","Sie verschwinden dauerhaft aus dem Wald.","Sie werden wieder zu totem Holz zusammengesetzt.","Zerkleinerer verwandeln sie in Laub."],correct:0,hint:"Wer braucht Mineralsalze zum Wachsen?",explain:"Pflanzen nehmen Mineralsalze mit den Wurzeln auf und bauen daraus neue Pflanzenteile."},
{q:"Spur 5: Warum spricht man hier von einem Stoffkreislauf? 🔄",diagram:true,opts:["Stoffe wandern von Pflanzen über totes Material und Zersetzer zurück zu den Pflanzen. Energie kommt von der Sonne.","Alle Stoffe verlassen den Wald und kommen als Regen zurück.","Energie wird immer wieder verwendet und geht nie verloren.","Pflanzen bleiben immer gleich groß."],correct:0,hint:"Im Bild endet der Weg dort, wo er angefangen hat.",explain:"Materie wird ständig recycelt. Energie kommt von der Sonne und fließt durch das Ökosystem."},
{q:"Spur 6: Ein Förster möchte alles Totholz entfernen. Welches Argument spricht aus Sicht des Nährstoffhaushalts dagegen? 🌲",opts:["Im Totholz werden Nährstoffe wie Stickstoff und Phosphor wieder pflanzenverfügbar. Ohne Totholz kann der Boden langfristig verarmen.","Totholz macht den Boden hart.","Totholz verhindert Pilzwachstum.","Totholz sieht schöner aus."],correct:0,hint:"Was geschieht im Totholz mit den Nährstoffen?",explain:"Im Totholz werden Nährstoffe remineralisiert. Das sorgt für Nachschub im Waldboden."},
{q:"Letzte Spur: Welches Argument spricht aus Sicht von Lebensraum und Artenvielfalt gegen das Aufräumen? 🪲",opts:["Totholz bietet spezialisierten Arten wie Käfern, Pilzen, Moosen und Flechten Lebensraum. Entfernen zerstört diese Lebensräume.","Nur wenige überall vorkommende Arten leben dort.","Totholz bietet ausschließlich Schädlingen Lebensraum.","Totholz ist unwichtig, weil Arten auf lebenden Bäumen leben können."],correct:0,hint:"Wer lebt alles in und auf Totholz?",explain:"Totholz bietet Lebensraum und fördert Artenvielfalt. Es kann außerdem Wasser speichern und vor Erosion schützen."}
];
const chat=document.getElementById('chat'),answers=document.getElementById('answers'),bar=document.getElementById('bar'),statusEl=document.getElementById('status'),app=document.getElementById('app');
let round=questions.map((_,i)=>i),pos=0,missed=[],solved=0,roundNo=1,lastPraise=-1;
const praises=["Super gemacht! 👏","Volltreffer! 🎯","Scharf kombiniert! 🧠","Stark ermittelt! 💪","Das sitzt! 🙌","Spitze! 🌟"];
function time(){return new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function add(html,cls='bot',user=false){const el=document.createElement('div');el.className='msg '+cls;el.innerHTML=(cls.includes('bot')?'<span class="name">Kommissarin Laubach</span>':'')+html+'<span class="time">'+time()+(user?' ✓✓':'')+'</span>';chat.append(el);chat.scrollTop=chat.scrollHeight;return el}
function typing(callback,delay=650){statusEl.textContent='schreibt …';const t=add('•••','bot');setTimeout(()=>{t.remove();statusEl.textContent='online';callback()},delay)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function ask(){const q=questions[round[pos]];typing(()=>{let html=(roundNo>1?'<i>🔁 Wiederholung</i><br>💡 <b>Tipp:</b> '+q.hint+'<br><br>':'')+q.q;if(q.diagram)html+='<div class="diagram">🌳 Pflanze → 🍂 totes Laub/Holz → 🐛 Zerkleinerer → 🍄🦠 Pilze &amp; Bakterien → '+(q===questions[3]?'<span class="questionmark">❓ ↺</span>':'💎 Mineralsalze')+' → 🌳</div>';add(html);answers.replaceChildren();shuffle(q.opts.map((text,index)=>({text,index}))).forEach(item=>{const b=document.createElement('button');b.className='opt';b.textContent=item.text;b.onclick=()=>answer(item.index,q,round[pos]);answers.append(b)})})}
function answer(index,q,id){answers.replaceChildren();add(q.opts[index],'user',true);if(index===q.correct){solved++;bar.style.width=(solved/questions.length*100)+'%';typing(()=>{let i;do{i=Math.floor(Math.random()*praises.length)}while(i===lastPraise);lastPraise=i;add('✅ <b>'+praises[i]+'</b><br>'+q.explain,'bot ok');next()})}else{missed.push(id);typing(()=>{add('🤔 Das passt noch nicht. '+q.hint+'<br>Ich frage dich diese Spur später noch einmal.','bot wrong');next()})}}
function next(){pos++;if(pos<round.length){ask();return}if(!missed.length){finish();return}round=missed;missed=[];pos=0;roundNo++;typing(()=>{add('📋 '+round.length+(round.length===1?' Spur ist':' Spuren sind')+' noch offen. Wir versuchen es noch einmal.','bot info');ask()})}
function finish(){typing(()=>{const stamp=document.createElement('div');stamp.className='stamp';stamp.innerHTML='🔍 SPURENSICHERUNG<br>ABGESCHLOSSEN ✅';chat.append(stamp);add('<div>🎉🥳🎊🏆🎉</div><strong>Super gemacht! 👏🌟</strong>Der große Fall ist geknackt! Hier ist dein geheimer Code:<div class="code">'+CODE+'</div>Merke dir diese Zahl oder schreibe sie auf! ✍️📝','bot final');const emojis=['🎉','🎊','🌟','⭐','🕵️','🔍','🍂','🌲','🏆','👏','✨','🥳','🍄','🐛','🪵'];for(let i=0;i<32;i++)setTimeout(()=>{const e=document.createElement('span');e.className='confetti';e.textContent=emojis[Math.floor(Math.random()*emojis.length)];e.style.left=Math.random()*95+'%';app.append(e);setTimeout(()=>e.remove(),4500)},i*80);chat.scrollTop=chat.scrollHeight},800)}
add('Willkommen zurück, Boden-Detektiv*in! 🕵️ Jetzt knacken wir <b>Station 4: Der große Fall – Totholz</b>. 🪵🍄 Falls eine Antwort nicht stimmt, frage ich am Ende noch einmal nach. Wenn du alles richtig hast, bekommst du einen geheimen Code. Bereit? 🔍');const start=document.createElement('button');start.className='opt';start.textContent='🔍 Ermittlung starten';start.onclick=()=>{answers.replaceChildren();add('Ermittlung starten','user',true);ask()};answers.append(start);
</script>
</body>
</html>
